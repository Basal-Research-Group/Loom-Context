[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-context"
version = "0.3.1"
description = "Architecture Context Engine for AI-First Engineering"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "J. Adrian Ruiz C.", email = "153795808+jadruiz@users.noreply.github.com" },
]
keywords = [
    "ai",
    "architecture",
    "context",
    "clean-architecture",
    "code-quality",
    "developer-tools",
    "engineering",
    "hexagonal",
    "linting",
    "llm",
    "loom",
    "naming-conventions",
    "project-scaffolding",
    "software-architecture",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pathspec>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
loom = "loom_context.cli:main"

[project.urls]
Homepage = "https://github.com/jadruiz/Loom-Context"
Repository = "https://github.com/jadruiz/Loom-Context"
Documentation = "https://github.com/jadruiz/Loom-Context/blob/main/docs/INDEX.md"
Issues = "https://github.com/jadruiz/Loom-Context/issues"
Changelog = "https://github.com/jadruiz/Loom-Context/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print (no print() in library code)
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "ERA",   # flake8-eradicate (commented-out code)
    "RUF",   # ruff-specific rules
]
ignore = [
    "UP007",   # Use X | Y (we need Optional for 3.9 compat)
    "UP045",   # Use X | None (we need Optional for 3.9 compat)
    "S101",    # Use of assert (needed in tests)
    "T201",    # print() allowed in CLI output module
    "PTH123",  # open() vs Path.open() — both are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "S603",    # subprocess calls in tests
    "S607",    # partial executable path in tests
]
"src/loom_context/cli.py" = [
    "T201",    # print/click.echo is the CLI's job
]
"src/loom_context/git.py" = [
    "S603",    # subprocess call to git is intentional
    "S607",    # git is expected on PATH
]
"src/loom_context/cli/commands/*.py" = [
    "T201",    # print/click.echo is the CLI's job
]

[tool.ruff.lint.isort]
known-first-party = ["loom_context"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["loom_context"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = [
    "B603",  # subprocess calls to git are intentional
    "B607",  # git is expected on PATH
    "B701",  # jinja2 autoescape=False — generating .md, not HTML
    "B404",  # subprocess import — used for git commands only
    "B311",  # random.sample — file sampling, not security
]
