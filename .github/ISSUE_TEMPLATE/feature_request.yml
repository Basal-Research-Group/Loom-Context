name: Feature Request
description: Propose a new capability or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation are you hitting today?
      placeholder: Describe the current workflow gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What should Loom-Context do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds or other designs did you consider?
  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
      description: Explain expected value for users, maintainers, or AI workflows.
